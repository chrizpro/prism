<!DOCTYPE html>
<html>

<head>
    <title>Prism</title>
    <link rel="icon" href="./favicon.ico" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./app.css" />
</head>

<body style="margin: 0; overflow: hidden">
<div id="out">
    <!-- The web loading page (v0.5): plain HTML, because it shows before .NET and Avalonia have loaded. Avalonia removes it when the app is up.
         main.js moves the bar while the app downloads. See docs/interface/startup.md. -->
    <div class="avalonia-splash" role="status" aria-live="polite">
        <svg class="mark" viewBox="80 80 360 320" aria-hidden="true"><polygon fill="#7762ED" points="232,94 294,148 418,380 356,326"/><polygon fill="#354FA8" points="108,326 356,326 418,380 170,380"/><polygon fill="#B5F2FF" points="232,94 108,326 232,250"/><polygon fill="#39C8ED" points="232,94 232,250 356,326"/><polygon fill="#4088ED" points="108,326 356,326 232,250"/></svg>
        <h2>Prism</h2>
        <div class="bar"><div class="fill" id="splash-fill"></div></div>
        <p class="status" id="splash-status">Downloading Prism…</p>
        <div class="notice" id="splash-notice" hidden>
            <h3 id="notice-title">Prism works best on a computer</h3>
            <p id="notice-text"></p>
            <div class="actions">
                <a class="button" id="notice-desktop" href="https://chrizpro.github.io/prism/download" target="_blank" rel="noopener">Get the desktop app</a>
                <button class="button primary" id="notice-continue" type="button">Continue anyway</button>
            </div>
        </div>
        <p class="note">Web version · the first visit downloads the app once; later visits open from your browser's cache</p>
    </div>
</div>
<script type='module' src="./main.js"></script>
</body>

</html>
