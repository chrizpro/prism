name: Bug report
description: Something in Prism is broken or behaves wrongly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Prism is in **alpha**, so bugs are expected and every clear report helps.
        Before you file, check the [known issues](https://chrizpro.github.io/prism/docs/reference/known-issues) and search the [open issues](https://github.com/chrizpro/prism/issues?q=is%3Aissue+is%3Aopen+label%3Abug). **Help (?) → Report a bug** in Prism opens this form with your version and system filled in. Reports are public; remove private information before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: What you saw, including any message Prism showed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The tools you used and the values you entered, in order. A small model that shows the problem is the most useful thing you can attach.
      placeholder: |
        1. Home › Box, 10 × 10 × 10 mm
        2. Solid › Shell, select the whole body, Inside, 2 mm
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Prism version
      description: Shown in the Help (?) menu.
      placeholder: 0.2.0 alpha
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Windows 11 (X64)
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots, files and logs
      description: Drag files here after removing private information. For a crash, use Prism's next-launch review prompt or paste only the reviewed diagnostic. Do not attach raw crash logs.
  - type: input
    id: documentation
    attributes:
      label: Relevant documentation (optional)
      description: For maintainers. Link the guide or tool page that describes this behavior, if you know it.
      placeholder: https://chrizpro.github.io/prism/docs/tool/...
  - type: input
    id: test
    attributes:
      label: Existing test path (optional)
      description: For maintainers.
      placeholder: Prism.Tests/... (or none)
