<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc"><title id="title">Boundary Surface: choose the job</title><desc id="desc">Three drawings compare a filled loop, a span between curves and a boundary with crossing interior guide curves.</desc><rect width="720" height="300" rx="16" fill="#0e1929"/><g font-family="Segoe UI, Arial, sans-serif"><text x="23" y="36" fill="#e7edf7" font-size="23">Boundary Surface: choose the job</text><g transform="translate(17 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Fill boundary</text><path d="M35 150V65H180V150Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">Close a loop.</text></g><g transform="translate(251 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Edge</text><path d="M30 150Q100 90 185 125 M30 75Q100 40 185 65" stroke="#5ee0ee" fill="none" stroke-width="3" stroke-linejoin="round" /><path d="M30 150L30 75L185 65L185 125Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">Span 2 to 4 curves.</text></g><g transform="translate(485 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Network</text><path d="M35 150V65H180V150Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><path d="M35 105Q100 70 180 105 M105 65Q80 110 105 150" stroke="#ffbb70" fill="none" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">Outline + inside curves.</text></g></g></svg>
