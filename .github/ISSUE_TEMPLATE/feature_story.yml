name: Feature story
description: Track a defined Prism feature and its documentation, implementation, and verification
title: "[Story] "
body:
  - type: markdown
    attributes:
      value: |
        A story tracks a specific body of work or feature review. The linked Markdown is the living specification; completed stories retain historical scope. Do not use this form as proof that requirements are approved.
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: What defined review or delivery work should this story complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Identify the feature or coherent change. Distinguish Solid, Surface and Freeform variants and state exclusions.
    validations:
      required: true
  - type: textarea
    id: specification
    attributes:
      label: Specification
      description: Link the canonical Markdown guide and implementation. State Proposed, Needs decision, Approved (with owner decision link), or No behavior change. Record the exact reviewed spec commit/release when completed.
      placeholder: "Guide: docs/<domain>/<feature>/README.md\nImplementation: Prism/...\nReview state: Proposed — awaiting owner review"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Track review/delivery tasks, not a duplicate copy of every Markdown requirement.
  - type: textarea
    id: tests
    attributes:
      label: Tests and evidence
      description: Link existing test files once per layer. Individual options/cases belong in Fact/AvaloniaFact names and Feature, Layer and TestId traits. Distinguish legacy checks and missing coverage. Record dated runs with source revision. Integration is deferred; when introduced, attach representative viewport images here.
  - type: textarea
    id: decisions
    attributes:
      label: Open decisions
      description: List unresolved product decisions and link related issues. Do not infer owner approval from passing tests. Later changes after closure receive new issues rather than rewriting this story's original scope.
