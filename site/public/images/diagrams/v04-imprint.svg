<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc"><title id="title">Imprint: mark a face without removing material</title><desc id="desc">A circle drawn on a planar face marks a disc region, while a line ending inside the face adds an edge without enclosing a region.</desc><rect width="720" height="300" rx="16" fill="#0e1929"/><g font-family="Segoe UI, Arial, sans-serif"><text x="23" y="36" fill="#e7edf7" font-size="23">Imprint: mark a face without removing material</text><g transform="translate(17 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Pick curves</text><path d="M35 150V65H180V150Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><circle cx="108" cy="108" r="27" fill="none" stroke="#ffbb70" stroke-width="3"/><text x="14" y="195" fill="#e7edf7" font-size="13">Circle on a solid face.</text></g><g transform="translate(251 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Closed loop</text><path d="M35 150V65H180V150Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><circle cx="108" cy="108" r="27" fill="#6b58ab" stroke="#ffbb70" stroke-width="3"/><text x="14" y="195" fill="#e7edf7" font-size="13">A new disc face; no cut.</text></g><g transform="translate(485 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Open line</text><path d="M35 150V65H180V150Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><path d="M35 110H120" stroke="#ffbb70" fill="none" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">An edge; no new face.</text></g></g></svg>
