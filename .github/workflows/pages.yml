name: Publish websites
# Publishes the promo site (web) at the Pages root and the guide (site) under /docs/.
on:
  push:
    branches: [main]
    paths: ['site/**', 'web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
      PAGES_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            web/package-lock.json
      - name: Build the guide
        working-directory: site
        run: npm ci && npm run build
        env:
          PRISM_SITE_BASE: ${{ env.PAGES_BASE }}docs/
      - name: Build the website
        working-directory: web
        run: npm ci && npm run build
        env:
          PRISM_WEB_SITE: ${{ env.PAGES_ORIGIN }}
          PRISM_WEB_BASE: ${{ env.PAGES_BASE }}
          PUBLIC_PRISM_DOCS_URL: ${{ env.PAGES_ORIGIN }}${{ env.PAGES_BASE }}docs
      - name: Combine
        run: |
          mkdir -p _site
          cp -r web/dist/. _site/
          mkdir -p _site/docs
          cp -r site/dist/. _site/docs/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
