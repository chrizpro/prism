<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc"><title id="title">Chamfer: three ways to size a bevel</title><desc id="desc">Three bevel cross-sections show equal legs, unequal legs and a leg plus angle.</desc><rect width="720" height="300" rx="16" fill="#0e1929"/><g font-family="Segoe UI, Arial, sans-serif"><text x="23" y="36" fill="#e7edf7" font-size="23">Chamfer: three ways to size a bevel</text><g transform="translate(17 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Equal distance</text><path d="M35 155V95L95 55H180" stroke="#5ee0ee" fill="none" stroke-width="3" stroke-linejoin="round" /><text x="40" y="80" fill="#e7edf7" font-size="17">d</text><text x="80" y="120" fill="#e7edf7" font-size="17">d</text><text x="14" y="195" fill="#e7edf7" font-size="13">Same leg on both sides.</text></g><g transform="translate(251 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Two distances</text><path d="M35 155V125L145 55H180" stroke="#5ee0ee" fill="none" stroke-width="3" stroke-linejoin="round" /><text x="40" y="110" fill="#e7edf7" font-size="17">2 mm</text><text x="105" y="95" fill="#e7edf7" font-size="17">4 mm</text><text x="14" y="195" fill="#e7edf7" font-size="13">Set each leg separately.</text></g><g transform="translate(485 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Distance + angle</text><path d="M35 155V110L125 55H180" stroke="#5ee0ee" fill="none" stroke-width="3" stroke-linejoin="round" /><text x="40" y="95" fill="#e7edf7" font-size="17">d</text><text x="100" y="105" fill="#e7edf7" font-size="17">angle</text><text x="14" y="195" fill="#e7edf7" font-size="13">Swap sides if needed.</text></g></g></svg>
