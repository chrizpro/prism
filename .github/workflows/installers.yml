name: Build Prism installers
# Push a tag like v0.1.0 to build every platform and publish a GitHub release (marked pre-release).
# Run it by hand to build one platform; tick "publish" to release that run as well.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Package version (major.minor.patch)
        default: '0.1.0'
        required: true
      platform:
        type: choice
        description: Target to build and validate
        options: [windows, macos, linux, all]
        default: windows
      publish:
        type: boolean
        description: Publish the result as a GitHub release
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, os: windows-2022, runtime: win-x64, triplet: x64-windows-release, asset: Prism-windows-x64-Setup.exe }
          - { platform: macos, os: macos-15, runtime: osx-arm64, triplet: arm64-osx-dynamic, asset: Prism-macos-arm64.dmg }
          - { platform: macos, os: macos-15-intel, runtime: osx-x64, triplet: x64-osx-dynamic, asset: Prism-macos-x64.dmg }
          - { platform: linux, os: ubuntu-24.04, runtime: linux-x64, triplet: x64-linux-dynamic, asset: Prism-linux-x64.deb }
    runs-on: ${{ matrix.os }}
    env:
      PRISM_PACKAGE_VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
      SELECTED: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == matrix.platform }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        if: env.SELECTED == 'true'
      - uses: actions/setup-dotnet@v4
        if: env.SELECTED == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Version
        if: env.SELECTED == 'true'
        run: |
          $version = $env:PRISM_PACKAGE_VERSION.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$version' must be major.minor.patch" }
          "PRISM_PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Linux build prerequisites
        if: env.SELECTED == 'true' && matrix.platform == 'linux'
        run: sudo apt-get update; sudo apt-get install -y autoconf autoconf-archive automake libtool pkg-config ninja-build libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev libgl1-mesa-dev dpkg-dev
      - name: macOS build prerequisites
        # vcpkg builds some Open CASCADE dependencies with autotools.
        if: env.SELECTED == 'true' && matrix.platform == 'macos'
        run: brew install autoconf autoconf-archive automake libtool pkg-config
      - name: Native dependencies and shims
        if: env.SELECTED == 'true'
        run: |
          $nativeVcpkg = Join-Path $env:RUNNER_TEMP 'prism-vcpkg'
          git clone https://github.com/microsoft/vcpkg.git $nativeVcpkg
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed' }
          git -C $nativeVcpkg checkout 817892b0ecbc6af994dd6df999c73faf795adbf2
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg checkout failed' }
          if ($IsWindows) { & "$nativeVcpkg/bootstrap-vcpkg.bat" -disableMetrics }
          else { & "$nativeVcpkg/bootstrap-vcpkg.sh" -disableMetrics }
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          & "$nativeVcpkg/vcpkg" install opencascade eigen3 netgen --triplet '${{ matrix.triplet }}' --overlay-triplets="$PWD/native/triplets"
          if ($LASTEXITCODE -ne 0) { throw 'Native dependency install failed' }
          ./native/build.ps1 -Vcpkg $nativeVcpkg -Triplet '${{ matrix.triplet }}'
      - name: NSIS compiler
        if: env.SELECTED == 'true' && matrix.platform == 'windows'
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          "C:/Program Files (x86)/NSIS" >> $env:GITHUB_PATH
      - name: Publish and package
        if: env.SELECTED == 'true'
        run: ./packaging/Build-Installer.ps1 -Runtime '${{ matrix.runtime }}' -Version $env:PRISM_PACKAGE_VERSION
      - name: Verify native runtime in published app
        if: env.SELECTED == 'true'
        run: |
          $binary = if ($IsWindows) { 'Prism.Desktop.exe' } else { 'Prism.Desktop' }
          $path = "./artifacts/installers/${{ matrix.runtime }}/publish/$binary"
          if ($IsWindows) {
            $probe = Start-Process -FilePath $path -ArgumentList '--verify-runtime' -WindowStyle Hidden -Wait -PassThru
            if ($probe.ExitCode -ne 0) { throw 'Published native runtime verification failed' }
          } else {
            & $path --verify-runtime
            if ($LASTEXITCODE -ne 0) { throw 'Published native runtime verification failed' }
          }
      - name: Name the download
        # A fixed file name lets the website link to releases/latest/download/<name>.
        if: env.SELECTED == 'true'
        run: |
          $package = Get-ChildItem ./artifacts/installers -File | Where-Object { $_.Name -match '(Setup\.exe|\.dmg|\.deb)$' } | Select-Object -First 1
          if (!$package) { throw 'No installer was produced' }
          New-Item -ItemType Directory -Force ./release | Out-Null
          Copy-Item $package.FullName "./release/${{ matrix.asset }}"
          $hash = (Get-FileHash "./release/${{ matrix.asset }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset }}" | Set-Content -NoNewline "./release/${{ matrix.asset }}.sha256"
      - name: LGPL source archive
        # The exact source of the LGPL libraries in this build: upstream archives plus vcpkg's recipes and patches.
        if: env.SELECTED == 'true' && matrix.platform == 'linux'
        run: |
          $vcpkg = Join-Path $env:RUNNER_TEMP 'prism-vcpkg'
          $staging = Join-Path $env:RUNNER_TEMP 'lgpl-sources'
          New-Item -ItemType Directory -Force "$staging/archives", "$staging/vcpkg-ports" | Out-Null
          $archives = Get-ChildItem "$vcpkg/downloads" -File | Where-Object { $_.Name -match '(?i)occt|opencascade|netgen' }
          if (!$archives) { throw 'No Open CASCADE or Netgen source archives in the vcpkg downloads' }
          $archives | Copy-Item -Destination "$staging/archives"
          foreach ($port in 'opencascade', 'netgen') { Copy-Item -Recurse "$vcpkg/ports/$port" "$staging/vcpkg-ports/$port" }
          @(
            'Source code of the LGPL-2.1 libraries shipped with Prism ${{ env.PRISM_PACKAGE_VERSION }}.',
            '',
            'archives/      upstream source archives, as downloaded by vcpkg',
            'vcpkg-ports/   the vcpkg build recipes and patches applied to them',
            '',
            'vcpkg commit: 817892b0ecbc6af994dd6df999c73faf795adbf2 (https://github.com/microsoft/vcpkg)',
            'Build each library with: vcpkg install opencascade netgen --overlay-ports=vcpkg-ports'
          ) | Set-Content "$staging/README.txt"
          Compress-Archive -Path "$staging/*" -DestinationPath ./release/Prism-LGPL-sources.zip -Force
      - uses: actions/upload-artifact@v4
        if: env.SELECTED == 'true'
        with:
          name: prism-${{ matrix.runtime }}
          path: release/*
          if-no-files-found: error

  release:
    needs: package
    # Only when every selected platform built, so a release never misses a platform silently.
    if: success() && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        run: |
          ls -l release
          [ -n "$(ls release)" ] || { echo "No installers were built"; exit 1; }
          gh release create "$VERSION" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Prism ${VERSION#v}" --prerelease --generate-notes
      - name: Refresh the download page
        # Releases made with the workflow token do not trigger other workflows, so start Pages directly.
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
