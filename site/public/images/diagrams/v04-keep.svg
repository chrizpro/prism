<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc"><title id="title">Keep the originals: check before confirming</title><desc id="desc">Separate input sheets, a result alone with retention off and originals plus result with retention on; shown apart for clarity.</desc><rect width="720" height="300" rx="16" fill="#0e1929"/><g font-family="Segoe UI, Arial, sans-serif"><text x="23" y="36" fill="#e7edf7" font-size="23">Keep the originals: check before confirming</text><g transform="translate(17 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Original sheets</text><path d="M30 75H90V150H30Z M125 75H185V150H125Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">Inputs to Sew.</text></g><g transform="translate(251 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Off (default)</text><path d="M35 150V65H180V150Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">Only the joined result.</text></g><g transform="translate(485 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">On</text><path d="M30 60H90V95H30Z M125 60H185V95H125Z" stroke="#ffbb70" fill="none" stroke-width="3" stroke-linejoin="round" /><path d="M30 115H185V155H30Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">Sources + joined result.</text></g></g></svg>
