<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title desc"><title id="title">Show Mode: Undeformed shape to Vibration mode shape</title><desc id="desc">A mode shape illustrates a vibration pattern, not actual displacement amplitude.</desc><rect width="760" height="370" rx="15" fill="#101d30"/><g font-family="Segoe UI, Arial, sans-serif"><text x="25" y="35" fill="#e6eef8" font-size="24">Show Mode</text><text x="25" y="75" fill="#90a2b8" font-size="18">Undeformed shape</text><text x="398" y="75" fill="#ffbd78" font-size="18">Vibration mode shape</text><g transform="translate(22 83)"><path d="M50 130H250" stroke="#68d5ee" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(395 83)"><path d="M50 130Q130 10 250 130" stroke="#ffbd78" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M50 130H250" stroke="#90a2b8" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 5"/></g><path d="M350 185L380 185M371.22417438109625 189.79425538604204L380 185L371.22417438109625 180.20574461395796" stroke="#ffbd78" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="25" y="349" fill="#90a2b8" font-size="12">EXPLANATORY DIAGRAM · NOT AN APPLICATION SCREENSHOT</text></g></svg>