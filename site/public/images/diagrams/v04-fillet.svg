<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc"><title id="title">Fillet: radii follow the picked edges</title><desc id="desc">An ordered edge selection, a per-edge radius list and a rounded junction between two perpendicular sheets.</desc><rect width="720" height="300" rx="16" fill="#0e1929"/><g font-family="Segoe UI, Arial, sans-serif"><text x="23" y="36" fill="#e7edf7" font-size="23">Fillet: radii follow the picked edges</text><g transform="translate(17 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Pick order</text><path d="M35 150V65H180" stroke="#ffbb70" fill="none" stroke-width="3" stroke-linejoin="round" /><text x="45" y="120" fill="#e7edf7" font-size="17">1</text><text x="120" y="90" fill="#e7edf7" font-size="17">2</text><text x="14" y="195" fill="#e7edf7" font-size="13">One entry for each edge.</text></g><g transform="translate(251 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Radius per edge</text><text x="22" y="100" fill="#e7edf7" font-size="26">3, 5-8, 2</text><text x="22" y="135" fill="#e7edf7" font-size="16">edge 2: 5 → 8 mm</text><text x="14" y="195" fill="#e7edf7" font-size="13">Extra edges use Radius.</text></g><g transform="translate(485 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Two surfaces</text><path d="M35 65V120Q35 150 65 150H185" stroke="#5ee0ee" fill="none" stroke-width="3" stroke-linejoin="round" /><path d="M35 120Q35 150 65 150" stroke="#ffbb70" fill="none" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">Pick a touching edge each.</text></g></g></svg>
