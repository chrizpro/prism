<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc"><title id="title">Parting-line draft: split crossing walls first</title><desc id="desc">A straight-sided part split at its middle plane and a drafted part that narrows toward both ends.</desc><rect width="720" height="300" rx="16" fill="#0e1929"/><g font-family="Segoe UI, Arial, sans-serif"><text x="23" y="36" fill="#e7edf7" font-size="23">Parting-line draft: split crossing walls first</text><g transform="translate(17 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Split at the plane</text><path d="M50 55V160H170V55Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><path d="M25 108H195" stroke="#ffbb70" fill="none" stroke-width="3" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="14" y="195" fill="#e7edf7" font-size="13">Upper and lower faces.</text></g><g transform="translate(251 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Positive angle</text><path d="M70 55L50 108L70 160H150L170 108L150 55Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><path d="M25 108H195" stroke="#ffbb70" fill="none" stroke-width="3" stroke-linejoin="round" stroke-dasharray="6 4"/><text x="14" y="195" fill="#e7edf7" font-size="13">Both ends narrow away.</text></g><g transform="translate(485 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Before confirming</text><text x="18" y="85" fill="#e7edf7" font-size="19">Neutral plane</text><text x="18" y="117" fill="#e7edf7" font-size="15">+ separate wall faces</text><text x="18" y="149" fill="#e7edf7" font-size="17">+ draft angle</text><text x="14" y="195" fill="#e7edf7" font-size="13">Centers decide the side.</text></g></g></svg>
