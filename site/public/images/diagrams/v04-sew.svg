<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc"><title id="title">Sew: joined edges or fewer faces?</title><desc id="desc">Two separate planar sheets become a stitched sheet with a middle edge, or one merged planar face without the edge.</desc><rect width="720" height="300" rx="16" fill="#0e1929"/><g font-family="Segoe UI, Arial, sans-serif"><text x="23" y="36" fill="#e7edf7" font-size="23">Sew: joined edges or fewer faces?</text><g transform="translate(17 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Two sheets</text><path d="M30 70H100V150H30Z M115 70H185V150H115Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">Pick adjacent surfaces.</text></g><g transform="translate(251 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Stitch</text><path d="M35 150V65H180V150Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><path d="M105 65V150" stroke="#ffbb70" fill="none" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">Shared edge; 2 faces.</text></g><g transform="translate(485 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Merge</text><path d="M35 150V65H180V150Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">Same surface; 1 face.</text></g></g></svg>
