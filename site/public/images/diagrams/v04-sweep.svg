<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="title desc"><title id="title">Sweep: control the size along the path</title><desc id="desc">A taper from full to half scale, a bulging variable section and the interpretation of the midpoint scale pair.</desc><rect width="720" height="300" rx="16" fill="#0e1929"/><g font-family="Segoe UI, Arial, sans-serif"><text x="23" y="36" fill="#e7edf7" font-size="23">Sweep: control the size along the path</text><g transform="translate(17 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Start and end</text><path d="M30 70L185 95V125L30 150Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">Scale 1 → 0.5.</text></g><g transform="translate(251 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Scale table</text><path d="M30 95Q105 35 185 100L185 120Q105 180 30 125Z" stroke="#5ee0ee" fill="#244d63" stroke-width="3" stroke-linejoin="round" /><text x="14" y="195" fill="#e7edf7" font-size="13">0:1, 0.5:1.6, 1:0.7</text></g><g transform="translate(485 60)"><rect width="218" height="216" rx="12" fill="#182638"/><text x="14" y="30" fill="#e7edf7" font-size="17">Read each pair</text><text x="23" y="92" fill="#e7edf7" font-size="25">0.5 : 1.6</text><text x="23" y="125" fill="#e7edf7" font-size="18">halfway : 1.6×</text><text x="14" y="195" fill="#e7edf7" font-size="13">Table replaces end scales.</text></g></g></svg>
